# Cloudflare Worker for the staff area. Step by step setup: docs/SETUP.md
name = "flickers-staff-api"
main = "src/index.js"
compatibility_date = "2025-01-01"

[vars]
GITHUB_REPO = "flickerscomics/flickerscomics.github.io"
GITHUB_BRANCH = "main"
# Origins allowed to call the API. Add "http://localhost:8080" while testing locally.
ALLOWED_ORIGINS = "https://flickerscomics.github.io"

# Create the namespace with:  npx wrangler kv namespace create USERS
# then paste the id it prints below.
[[kv_namespaces]]
binding = "USERS"
id = "e2534491249a49fe83ca2dd0db40ed25"

# Secrets are not stored in this file. Set them with `npx wrangler secret put NAME`:
#   SESSION_SECRET   a long random string
#   SETUP_KEY        a one-time key used to create the first owner account
#   GITHUB_TOKEN     fine-grained GitHub token: this repo only, Contents: read and write
